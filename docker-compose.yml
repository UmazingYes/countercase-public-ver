services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://countercase:countercase@db:5432/countercase
      - FRONTEND_ORIGIN=http://localhost:5173
      - JUDGE_PATH=/app/judge
      - ENVIRONMENT=development
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=countercase
      - POSTGRES_PASSWORD=countercase
      - POSTGRES_DB=countercase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
